<!doctype html>
<html lang="en" data-view="advisor"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ryan &amp; Maya — Greece Honeymoon</title>
<script>(function(){try{var k='voygent.folio.advisorTheme';var t=localStorage.getItem(k);if(t!=='dark'&&t!=='light'){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script><style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  :root{
    --primary:#1f3a5f; --primary-dark:#152a45; --primary-light:#e7edf4;
    --accent:#3f7d4f; --accent-dark:#2f6a40; --accent-light:#e6efe6;
    --accent-flight:#c97e16; --accent-lodging:#a85d6b; --accent-port:#2f7d72;
    --amber:#f5a623; --amber-deep:#c97e16; --white:#fff; --bg:#faf6ef; --panel:#fffdf8; --panel-2:#ffffff;
    --bg-light:#f3ede1; --text:#2b2620; --text-light:#5c5346; --text-muted:#8a7f6f;
    --line:#e8e1d4; --border:#e8e1d4; --border-strong:#d6ccb8;
    --shadow:0 1px 2px rgba(43,38,32,.04),0 8px 24px rgba(43,38,32,.07); --radius:14px; --radius-sm:8px;
    --success:#3f7d4f; --warning:#c87a1a; --danger:#b2483b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.55 'Hanken Grotesk',-apple-system,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:600;letter-spacing:-.01em}

  /* ---- sticky top nav (server-rendered links; app scrolls to #anchor) ---- */
  .fb-nav{position:sticky;top:0;z-index:20;display:flex;gap:14px;overflow-x:auto;
    padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  .fb-nav a{white-space:nowrap;color:var(--text);text-decoration:none;font-size:14px}
  .fb-nav a:hover{color:var(--primary)}
  @media print{.fb-nav{display:none}}

  /* ---- layout ---- */
  #fb-root{display:block}
  .wrap{max-width:760px;margin:0 auto;padding:24px 18px 120px}
  main#fb-root .wrap{padding-top:18px;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}

  /* ---- header ---- */
  .fb-head{text-align:center;margin:8px 0 18px}
  .eyebrow{letter-spacing:.16em;text-transform:uppercase;font-size:11px;color:var(--text-muted)}
  h1{font-size:30px;line-height:1.15;margin:6px 0 4px;font-weight:700}
  .sub{color:var(--text-light);margin:0;font-size:14px}
  /* quiet header-level "How this works" link that opens the help dialog */
  .fb-howto{margin-top:10px;background:none;border:0;padding:6px 8px;cursor:pointer;
    font-size:12.5px;color:var(--text-muted);text-decoration:underline;min-height:32px}
  .fb-howto:hover{color:var(--primary)}
  .fb-howto:before{content:"\24D8\00a0"}  /* circled i */

  /* ---- quiet in-board intro (1-2 muted lines, not a banner) ---- */
  .fb-intro{margin:0 0 20px;font-size:12.5px;line-height:1.6;color:var(--text-muted);text-align:center}
  .fb-intro b{color:var(--text-light);font-weight:600}
  .fb-advisor-banner{margin:0 0 14px;padding:8px 12px;border:1px solid var(--primary);border-left:4px solid var(--primary);
    border-radius:var(--radius-sm,8px);background:var(--primary-light);color:#16364f;font-size:12px;line-height:1.45;text-align:left}
  .fb-advisor-banner b{color:var(--primary-dark)}

  /* ---- inline (?) help buttons ---- */
  .help-q{position:relative;display:inline-flex;align-items:center;justify-content:center;
    width:18px;height:18px;margin-left:6px;padding:0;border:1px solid var(--border-strong);
    border-radius:50%;background:var(--panel-2);color:var(--text-muted);font-size:11px;font-weight:700;
    line-height:1;cursor:pointer;vertical-align:middle;transition:border-color .15s ease,color .15s ease}
  .help-q:hover{border-color:var(--primary);color:var(--primary)}
  /* invisible 44px hit target centered on the 18px glyph (mobile touch) */
  .help-q:after{content:"";position:absolute;top:50%;left:50%;width:44px;height:44px;
    transform:translate(-50%,-50%)}

  /* ---- progress strip / steps-to-book ---- */
  .fb-progress{margin:0 0 22px;padding:14px 16px;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--radius-sm);transition:border-color .15s ease,background .15s ease}
  .fb-progress .pbar{height:6px;border-radius:6px;background:var(--panel-2);overflow:hidden;margin-bottom:8px}
  .fb-progress .pbar > span{display:block;height:100%;background:var(--accent);transition:width .25s}
  .fb-progress .plabel{font-size:12.5px;color:var(--text-light);display:flex;justify-content:space-between;gap:10px}
  .fb-progress .plabel b{color:var(--text)}
  /* clickable chips for each still-open required decision (scroll-to-section) */
  .fb-steps{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
  .fb-steps .slabel{flex-basis:100%;font-size:11px;letter-spacing:.04em;text-transform:uppercase;
    color:var(--text-muted);margin-bottom:-2px}
  .fb-step{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:6px 12px;
    border:1px solid var(--border-strong);border-radius:20px;background:var(--panel-2);
    color:var(--text);font-size:12.5px;font-weight:600;text-decoration:none;cursor:pointer;
    transition:border-color .15s ease,background .15s ease,color .15s ease}
  .fb-step:hover{border-color:var(--primary);color:var(--primary)}
  .fb-step:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--warning);flex:none}
  /* READY state: celebratory green wash + accent border once all required decisions are made */
  .fb-progress.ready{border-color:var(--accent);
    background:linear-gradient(180deg,rgba(59,175,42,.16),rgba(59,175,42,.03) 70%),var(--panel)}
  .fb-progress.ready .pbar > span{background:var(--accent)}
  .fb-ready-banner{display:flex;align-items:center;gap:8px;margin-top:10px;
    font-size:13.5px;font-weight:700;color:var(--accent)}
  .fb-ready-banner:before{content:"\2728";font-size:15px}
  .fb-ready-banner .rb-sub{font-weight:500;color:var(--text-light)}

  /* ---- section ---- */
  .fb-section{margin:0 0 8px;scroll-margin-top:64px}
  .sec-no{display:flex;align-items:center;gap:10px;letter-spacing:.1em;
    text-transform:uppercase;font-size:15px;font-weight:700;color:var(--text-light);margin:0 0 14px}
  .sec-no b{color:var(--primary);font-size:17px;font-weight:800}
  .group-note{font-size:13px;color:var(--text-light);margin:0 0 14px;padding:10px 12px;
    background:var(--panel);border-radius:var(--radius-sm);border-left:3px solid var(--primary)}
  .rule{height:1px;background:var(--line);margin:26px 0}

  /* ---- cards ---- */
  .fb-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px 16px 20px;margin-bottom:12px;position:relative;cursor:pointer;
    transition:border-color .15s ease,box-shadow .15s ease,background .15s ease,transform .15s ease}
  .fb-card:hover{border-color:var(--border-strong)}
  /* Selected: bold 4px left accent bar + full primary ring + stronger tint, so the
     chosen card pops at a glance. Title/price/summary stay full-contrast — recede
     happens on unselected siblings (below), never by washing out the winner. */
  .fb-card.sel{border-color:var(--primary);
    box-shadow:inset 4px 0 0 0 var(--primary),0 0 0 2px var(--primary),var(--shadow);
    background:linear-gradient(180deg,rgba(27,97,156,.20),rgba(27,97,156,.04) 70%),var(--panel)}
  /* When a group has a winner, let the OTHERS recede by sinking their surface toward
     the page background + a muted border — NOT opacity — so title/price/summary text
     stays at full contrast (this is the washout we deliberately avoid). */
  .fb-card.dim{border-color:var(--line);background:var(--bg)}
  .fb-card.dim:hover{border-color:var(--border-strong);background:var(--panel)}
  .fb-card.static{cursor:default}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
  .ttl{font-weight:600;font-size:16px}
  .summary{color:var(--text-light);font-size:13px;margin-top:3px}
  .price{font-weight:700;font-size:18px;white-space:nowrap;padding-right:30px}
  .price.range{font-size:15px}
  .price.none{color:var(--text-muted);font-weight:600;font-size:13px}
  .opt-note{font-size:12.5px;color:var(--text-muted);margin-top:8px}
  .link{color:#6fb3e0;font-size:12.5px;text-decoration:none}
  .link:hover{text-decoration:underline}

  /* ---- badges ---- */
  .tags{margin-top:9px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .tag{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600;line-height:1.4}
  .tag.quoted{background:rgba(67,196,99,.16);color:var(--success)}
  .tag.est{background:rgba(245,166,35,.16);color:var(--warning)}
  .tag.neutral{background:var(--panel-2);color:var(--text-light)}
  .tag.rec{background:var(--primary-light);color:var(--primary-dark)}
  .tag.sel-badge{background:rgba(27,97,156,.18);color:#6fb3e0}
  /* the live client pick — solid primary fill so "Selected" reads as the ACTIVE choice,
     clearly distinct from the advisor-locked green "Confirmed" pill */
  .tag.picked{background:var(--primary);color:#fff;box-shadow:0 0 0 1px var(--primary)}
  .tag.picked:before{content:"✓ "}
  .tag.conf{background:rgba(67,196,99,.16);color:var(--success)}
  .tag.alt{background:var(--panel-2);color:var(--text-muted)}
  .tag.delta-up{background:rgba(229,86,76,.14);color:#f08a82}
  .tag.delta-down{background:rgba(67,196,99,.16);color:var(--success)}
  .tag.photo{background:var(--panel-2);color:var(--text-light)}
  .tag.flag{background:rgba(245,166,35,.16);color:var(--warning)}
  .ribbon{position:absolute;top:-9px;left:16px;background:var(--primary);color:#fff;
    font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 10px;border-radius:20px}
  .star{color:var(--warning)}

  /* ---- pick indicator ---- */
  .pick{position:absolute;top:14px;right:16px;width:22px;height:22px;border-radius:50%;
    border:2px solid var(--border-strong);transition:border-color .15s ease,background .15s ease}
  /* Selected single-choice: filled primary disc with a clear white ✓ (was an empty
     filled dot before — the check makes "this is your pick" unmistakable). */
  .fb-card.sel .pick{border-color:var(--primary);background:var(--primary)}
  .fb-card.sel .pick:after{content:"✓";color:#fff;font-size:13px;font-weight:800;line-height:1;
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
  .fb-card.sel .price{padding-right:32px}
  /* Multi-choice keeps the rounded-square checkbox look but shares the ✓ glyph. */
  .fb-card[data-multi="1"] .pick{border-radius:6px}

  /* ---- locked group ---- */
  .fb-card.locked,.fb-section.locked-section .fb-card{cursor:not-allowed;pointer-events:none;border-style:dashed}
  .fb-card.locked .pick,.fb-section.locked-section .fb-card .pick{opacity:.35}
  .lock-banner{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--warning);margin:0 0 14px;padding:10px 13px;
    background:rgba(245,166,35,.12);border:1px solid rgba(245,166,35,.32);border-radius:var(--radius-sm)}
  .lock-banner:before{content:"\1F512";font-size:14px}

  /* ---- island tablist ---- */
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tab{flex:1;text-align:center;padding:11px;border:1px solid var(--line);border-radius:var(--radius-sm);
    background:var(--panel);cursor:pointer;font-weight:600;transition:.15s;color:var(--text-light)}
  .tab.on{border-color:var(--primary);color:var(--text);
    background:linear-gradient(180deg,rgba(27,97,156,.16),transparent),var(--panel)}
  .tab .ts{display:block;font-size:11.5px;font-weight:500;color:var(--text-muted);margin-top:2px}

  /* ---- ask-advisor affordance ---- */
  .ask-link{display:inline-block;margin-top:4px;font-size:12px;color:var(--text-muted);
    background:none;border:0;cursor:pointer;padding:0;text-decoration:underline}
  .ask-link:hover{color:var(--primary)}

  /* ---- day-by-day itinerary (space-conserving accordion) ---- */
  .fb-days{margin:0 0 8px}
  .fb-day{border:1px solid var(--line,#e2e2e2);border-radius:10px;margin:10px 0;overflow:hidden}
  .fb-day-row{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:12px 14px;font:inherit;text-align:left;cursor:pointer}
  .fb-day-chev{flex:0 0 auto;color:#888}
  .fb-day-title{flex:1 1 auto;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Advisor: action button rides the header line; the toggle row shrinks so the
     title truncates instead of pushing the button onto its own line. */
  .fb-day-head{display:flex;align-items:center;gap:6px;padding-right:8px}
  .fb-day-head .fb-day-row{flex:1 1 auto;min-width:0}
  .fb-day-head .fb-kebab{flex:0 0 auto}
  .fb-day-chips{flex:0 0 auto;color:#666;font-size:.85em}
  .fb-day-chip{white-space:nowrap}
  .fb-day-body{display:none;padding:0 14px 14px}
  .fb-day--open .fb-day-body{display:block}
  .fb-day-loc{color:#666;font-size:.9em;margin:2px 0 8px}
  .fb-day-narr{margin:0 0 10px}
  .fb-day-acts,.fb-day-dining{margin:8px 0}
  .fb-day-acts-label,.fb-day-dining-label{font-weight:600;font-size:.85em;text-transform:uppercase;letter-spacing:.03em;color:#777;margin-bottom:4px}
  .fb-day-act{background:none;border:0;padding:0;font:inherit;color:#1a5;border-bottom:1px dotted #1a5;cursor:pointer}
  .fb-day-act--static{color:#333}
  .fb-day-act-link{text-decoration:none}
  .fb-day-act-desc{display:none;color:#555;font-size:.92em;margin:4px 0 4px 0}
  .fb-day-act-desc--on{display:block}
  .fb-day-act-item + .fb-day-act-item::before{content:"· ";color:var(--text-muted)}
  .fb-day-dining-item{margin:6px 0}
  .fb-day-dining-name{font-weight:600;color:#1a5;text-decoration:none}
  .fb-day-dining-cuisine{color:#888;font-size:.9em}
  .fb-day-dining-desc{color:#555;font-size:.92em}
  .fb-day-cond{margin:8px 0;padding-left:10px;border-left:2px solid #d8e8df}
  .fb-day-cond-pending{color:#777;font-style:italic;font-size:.92em}
  .fb-day-stay{margin-top:10px;color:#555;font-size:.92em;display:flex;align-items:center;gap:6px}
  .fb-day-stay-link{background:none;border:0;padding:0;color:#1a5;cursor:pointer;font:inherit}
  .fb-day-hint{color:#666;font-size:.9em;margin:6px 0}
  .fb-day-showall{background:none;border:1px solid var(--line,#e2e2e2);border-radius:8px;padding:4px 10px;font:inherit;cursor:pointer;margin:4px 0 8px;color:#1a5}
  @keyframes fbflash{0%,100%{background:transparent}50%{background:rgba(26,170,85,.18)}}
  .fb-flash--on{animation:fbflash .6s ease-in-out 3;border-radius:6px}
  .fb-flash--static{background:rgba(26,170,85,.12);border-radius:6px}
  @media (prefers-reduced-motion: reduce){.fb-flash--on{animation:none;background:rgba(26,170,85,.12)}}
  @media print{.fb-day-body{display:block !important}.fb-day-chev{display:none}.fb-day-act-desc{display:block !important}}
  @media (min-width: 820px){
    .fb-day--open .fb-day-act-desc{display:block;margin-left:14px}
    .fb-day-acts-list{display:block}
    .fb-day-act-item{display:block;margin:4px 0}
    .fb-day-act-item + .fb-day-act-item::before{content:none}
  }

  /* ---- budget ---- */
  .budget{background:var(--panel);border:1px solid var(--primary);border-radius:var(--radius);padding:6px 18px 14px}
  .bhead{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 8px;border-bottom:1px solid var(--line)}
  .bhead .bt{font-weight:700}
  .bhead .bn{font-size:11.5px;color:var(--text-muted)}
  .bline{display:flex;justify-content:space-between;padding:8px 0;font-size:13.5px;border-bottom:1px solid var(--line)}
  .bline .bk{color:var(--text-light)}.bline .bv{font-weight:600;white-space:nowrap}
  .bline.dim{opacity:.5}
  .btot{display:flex;justify-content:space-between;padding:12px 0 4px;font-weight:700;font-size:16px}
  .fb-addon-grp{margin:14px 0 4px;border-top:1px solid var(--line);padding-top:12px}
  .fb-addon-head{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-light);margin-bottom:4px}
  .fb-addon-note{font-size:12px;color:var(--text-muted);margin-bottom:8px;line-height:1.45}
  .fb-addon-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;
    border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:6px 0;cursor:pointer;font:inherit;color:var(--text)}
  .fb-addon-row:hover{border-color:var(--border-strong)}
  .fb-addon-row.on{border-color:var(--primary);background:var(--primary-light)}
  .fb-addon-check{flex:0 0 auto;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border-strong);
    display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--text-muted)}
  .fb-addon-row.on .fb-addon-check{background:var(--primary);border-color:var(--primary);color:#fff}
  .fb-addon-lb{flex:1 1 auto;min-width:0}
  .fb-addon-pr{flex:0 0 auto;font-weight:700;font-size:13px;white-space:nowrap}

  /* ---- includes ---- */
  .fb-includes details{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:0 14px;margin-bottom:8px}
  .fb-includes summary{cursor:pointer;font-weight:600;padding:12px 0;list-style:none}
  .fb-includes summary::-webkit-details-marker{display:none}
  .fb-includes summary:before{content:"▸ ";color:var(--primary)}
  .fb-includes details[open] summary:before{content:"▾ "}
  .fb-includes .ibody{font-size:13.5px;color:var(--text-light);padding:0 0 14px}

  /* ---- next steps ---- */
  .next-steps{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
  .next-steps p{margin:0 0 10px;font-size:13.5px;color:var(--text-light)}
  .btn{display:inline-block;background:var(--primary);color:#fff;border:0;border-radius:var(--radius-sm);
    padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
  .btn:hover{background:var(--primary-dark)}
  .btn.ghost{background:transparent;border:1px solid var(--border-strong);color:var(--text)}
  .btn.ghost:hover{border-color:var(--primary);color:var(--primary)}
  /* before ready, the primary send CTA sits visibly secondary (ghost). Once every
     required decision is made, .lit promotes it: solid accent fill + soft glow. */
  .btn.lit{background:var(--accent);border:1px solid var(--accent);color:#fff;
    box-shadow:0 0 0 3px rgba(59,175,42,.22),var(--shadow)}
  .btn.lit:hover{background:var(--accent-dark);border-color:var(--accent-dark)}

  /* ---- sticky total footer ---- */
  .fb-sticky-total{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:12px 18px;
    background:linear-gradient(0deg,var(--bg) 70%,transparent);backdrop-filter:blur(4px)}
  /* row 1 = total + send button (always visible); picklist wraps below on narrow */
  .fb-sticky-total .inner{max-width:760px;margin:0 auto;background:var(--primary);color:#fff;
    border-radius:var(--radius);padding:12px 16px;display:flex;flex-wrap:wrap;justify-content:space-between;
    align-items:center;gap:10px 14px;box-shadow:var(--shadow)}
  .fb-sticky-total .tot{flex:1 1 auto;min-width:0}
  .fb-sticky-total .tl{font-size:12px;opacity:.85;letter-spacing:.05em;text-transform:uppercase}
  .fb-sticky-total .tv{font-size:22px;font-weight:800;margin-top:1px}
  .fb-sticky-total .tmeta{font-size:11px;opacity:.85;margin-top:2px}
  /* the always-visible primary submit, living in the bar next to the total */
  .fb-sticky-total .fb-send{flex:0 0 auto;white-space:nowrap;min-height:44px;
    padding:11px 16px;max-width:55%;overflow:hidden;text-overflow:ellipsis}
  /* Re-skin the send button's quiet/lit states for legibility on the primary fill:
     ghost = subtle inset on the bar; lit = inverted (white) so it reads as the action. */
  .fb-sticky-total .fb-send.ghost{background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.55);color:#fff}
  .fb-sticky-total .fb-send.ghost:hover{background:rgba(255,255,255,.22);
    border-color:#fff;color:#fff}
  .fb-sticky-total .fb-send.lit{background:#fff;border:1px solid #fff;color:var(--primary-dark);
    box-shadow:0 0 0 3px rgba(255,255,255,.28),var(--shadow)}
  .fb-sticky-total .fb-send.lit:hover{background:#f2f6fb;border-color:#f2f6fb;color:var(--primary-dark)}
  .fb-sticky-total .fb-send:focus-visible{outline:2px solid #fff;outline-offset:2px}
  /* build-progress: collapsible per-decision "picked vs left" viz in the sticky total.
     Collapsed by default (just total + send + this summary toggle) so the bar stays
     small on a phone; tapping the summary reveals the chips + pricing detail. */
  .fb-bp-summary{flex:1 1 100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.42);color:#fff;
    font:inherit;font-size:12px;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer}
  .fb-bp-summary:hover{background:rgba(255,255,255,.18)}
  .fb-bp-summary:focus-visible{outline:2px solid #fff;outline-offset:2px}
  .fb-bp-chev{font-size:13px;opacity:.9;flex:0 0 auto}
  .fb-buildprog{flex:1 1 100%;min-width:0;margin-top:6px}
  .fb-sticky-total:not(.expanded) .fb-buildprog{display:none}
  .fb-bp-asof{font-size:10.5px;opacity:.8;margin-top:8px}
  /* COLLAPSED state = ONE slim line pinned flush to the very bottom edge:
     tappable total · progress chip · Submit, all on a single non-wrapping row.
     No outer gap, no rounded bottom, iOS safe-area aware. Expanded state keeps
     the fuller floating layout. */
  .fb-sticky-total:not(.expanded){padding:0;background:none;backdrop-filter:none}
  .fb-sticky-total:not(.expanded) .inner{max-width:none;border-radius:0;
    flex-wrap:nowrap;gap:8px 12px;padding:7px 14px;
    padding-bottom:calc(7px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -2px 10px rgba(0,0,0,.28)}
  .fb-sticky-total:not(.expanded) .tl{display:none}
  /* Price keeps its full width (the headline number, never shrinks/overlaps);
     the progress chip is the flexible element that truncates when space is tight. */
  .fb-sticky-total:not(.expanded) .tot{flex:0 0 auto;order:1;overflow:hidden}
  .fb-sticky-total:not(.expanded) .tv{font-size:17px;margin-top:0;white-space:nowrap}
  .fb-sticky-total:not(.expanded) .fb-bp-summary{flex:1 1 auto;order:2;min-width:0;
    font-size:11.5px;padding:6px 10px;border-radius:7px;overflow:hidden}
  .fb-sticky-total:not(.expanded) .fb-bp-summary .fb-bp-sum-lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fb-sticky-total:not(.expanded) .fb-send{order:3;min-height:36px;padding:7px 14px;font-size:14px;white-space:nowrap;max-width:none}
  /* The total doubles as a tap target that jumps to the budget breakdown. A faint
     dotted underline signals tappability (no hover on touch). */
  .fb-tv-link{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;
    text-decoration-color:rgba(255,255,255,.55)}
  .fb-tv-link:hover{text-decoration-style:solid;text-decoration-color:#fff}
  .fb-tv-link:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:4px}
  .fb-bp-chips{display:flex;flex-wrap:wrap;gap:6px}
  .fb-bchip{display:inline-flex;align-items:center;gap:5px;max-width:47%;
    font:inherit;font-size:11px;line-height:1;padding:5px 9px;border-radius:100px;
    white-space:nowrap;overflow:hidden;cursor:pointer}
  .fb-bchip .fb-bchip-lb{overflow:hidden;text-overflow:ellipsis}
  .fb-bchip .fb-bchip-ic{font-weight:800;flex:0 0 auto}
  .fb-bchip.todo{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.5);color:#fff;opacity:.92}
  .fb-bchip.done{background:#fff;border:1px solid #fff;color:var(--primary-dark);font-weight:700}
  .fb-bchip.addon{cursor:default;background:rgba(255,255,255,.16);border:1px dashed rgba(255,255,255,.6);color:#fff}
  .fb-bchip:focus-visible{outline:2px solid #fff;outline-offset:2px}
  @media (max-width:560px){
    .fb-sticky-total .fb-send{max-width:none}
    .fb-bchip{max-width:100%}
    /* tighten the one-line collapsed bar so price + chip + Submit never collide */
    .fb-sticky-total:not(.expanded) .tv{font-size:15px}
    .fb-sticky-total:not(.expanded) .fb-send{font-size:13px;padding:7px 11px}
    .fb-sticky-total:not(.expanded) .inner{gap:6px 8px;padding-left:10px;padding-right:10px}
  }

  /* ---- feedback dialog ---- */
  #fb-feedback{border:1px solid var(--border-strong);border-radius:var(--radius);padding:0;max-width:440px;
    width:92%;background:var(--panel);color:var(--text)}
  #fb-feedback::backdrop{background:rgba(0,0,0,.55)}
  .fb-dialog-in{padding:20px}
  #fb-feedback h3{margin:0 0 4px;font-size:18px}
  #fb-feedback .fb-dsub{margin:0 0 14px;font-size:13px;color:var(--text-light)}
  #fb-feedback label{display:block;font-size:12px;color:var(--text-light);margin:10px 0 4px}
  #fb-feedback input,#fb-feedback textarea{width:100%;background:var(--bg);color:var(--text);
    border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 11px;font:inherit;font-size:14px}
  #fb-feedback textarea{min-height:96px;resize:vertical}
  .fb-dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
  .fb-confirm{font-size:13px;color:var(--success);margin-top:10px}

  /* ---- help dialog (reuses the feedback dialog chrome) ---- */
  #fb-help{border:1px solid var(--border-strong);border-radius:var(--radius);padding:0;max-width:460px;
    width:92%;background:var(--panel);color:var(--text)}
  #fb-help::backdrop{background:rgba(0,0,0,.55)}
  #fb-help h3{margin:0 0 12px;font-size:18px}
  #fb-help dl{margin:0}
  #fb-help dt{font-weight:700;font-size:13.5px;margin-top:14px;display:flex;align-items:center;gap:8px}
  #fb-help dt:first-child{margin-top:0}
  #fb-help dd{margin:5px 0 0;font-size:13px;color:var(--text-light);line-height:1.55}
  #fb-help .help-tag{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600;line-height:1.4}
  #fb-help .help-tag.est{background:rgba(245,166,35,.16);color:var(--warning)}
  #fb-help .help-tag.quoted{background:rgba(67,196,99,.16);color:var(--success)}

  /* ---- partial-submit confirm dialog (reuses dialog chrome) ---- */
  #fb-confirm-partial{border:1px solid var(--border-strong);border-radius:var(--radius);padding:0;max-width:420px;
    width:92%;background:var(--panel);color:var(--text)}
  #fb-confirm-partial::backdrop{background:rgba(0,0,0,.55)}
  #fb-confirm-partial h3{margin:0 0 8px;font-size:18px}
  #fb-confirm-partial .fb-dsub{margin:0 0 4px;font-size:13.5px;color:var(--text-light);line-height:1.55}
  .fb-pickslist{margin:10px 0 4px;padding:0 0 0 18px;max-height:38vh;overflow-y:auto;
    font-size:13.5px;color:var(--text);line-height:1.5}
  .fb-pickslist li{margin:4px 0}
  .fb-pickslist .fb-pickslist-empty{list-style:none;margin-left:-18px;color:var(--text-muted);font-style:italic}

  /* ---- advisor notes ---- */
  .fb-note{margin:0 0 14px;padding:12px 14px;border-radius:var(--radius-sm);
    background:rgba(110,168,254,.08);border-left:3px solid var(--primary);}
  .fb-note .fb-note-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--text)}
  .fb-note .fb-note-h:before{content:"\1F4CC";font-size:13px}
  .fb-note .fb-note-body{margin-top:6px;font-size:13.5px;color:var(--text-light);white-space:pre-wrap}
  .fb-note .fb-note-link{display:inline-block;margin-top:8px;font-size:12.5px;color:#6fb3e0;text-decoration:none}
  .fb-note .fb-note-link:hover{text-decoration:underline}
  .fb-note-chip{display:inline-flex;align-items:center;gap:6px;margin:0 0 12px;padding:6px 11px;
    font-size:12px;font-weight:600;color:var(--text-light);background:var(--panel-2);
    border:1px solid var(--line);border-radius:20px;cursor:pointer}
  .fb-note-chip:before{content:"\1F4CC";font-size:12px;flex:0 0 auto}
  .fb-note-chip-label{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @media print{.fb-note-chip{display:none}.fb-note{break-inside:avoid}}

  /* ---- print ---- */
  @media print{
    .fb-nav,#fb-send-picks,#fb-send-picks-secondary,#fb-feedback,#fb-help,#fb-confirm-partial,.fb-sticky-total,
    .fb-howto,.help-q,.fb-steps{display:none!important}
    .fb-card{break-inside:avoid}
    body{background:#fff;color:#000}
  }

  /* ---- reduced motion ---- */
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}

  /* ---- focus rings ---- */
  a:focus-visible,button:focus-visible,[role=radio]:focus-visible,[role=checkbox]:focus-visible,
  [role=tab]:focus-visible{outline:2px solid var(--primary,#b08d57);outline-offset:2px}

  /* ---- ✨ advisor per-item polish menu (advisor view only) ---- */
  .fb-spark{position:relative;display:inline-block;margin-left:6px}
  .fb-spark-btn{background:none;border:0;cursor:pointer;font-size:13px;line-height:1;padding:0 2px;opacity:.85}
  .fb-spark-btn:hover{opacity:1}
  .fb-spark-menu{position:absolute;z-index:20;left:0;top:100%;margin-top:4px;min-width:180px;max-width:min(240px, calc(100vw - 24px));
    background:var(--panel-2);border:1px solid var(--border-strong);border-radius:8px;box-shadow:var(--shadow);padding:4px}
  .fb-spark-menu[hidden]{display:none}
  .fb-spark-item{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);
    font:inherit;font-size:13px;padding:7px 10px;border-radius:6px;cursor:pointer}
  .fb-spark-item:hover{background:var(--primary);color:#fff}

  /* ---- ＋ add composer (advisor view only) — two modes: ask-the-assistant (B-queue
         describe path) + I'll-type-it inline form (B-inline op:"add") ---- */
  .fb-add{display:block;margin:8px 0}
  .fb-add-btn{display:inline-block;background:none;border:1px dashed var(--border-strong);
    color:var(--primary);font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;cursor:pointer}
  .fb-add-btn:hover{border-color:var(--primary);background:var(--primary-light)}
  .fb-add-panel{display:block;margin:8px 0 4px;padding:10px;background:var(--panel-2);
    border:1px solid var(--border-strong);border-radius:8px;width:100%}
  .fb-add-mode{display:block;width:100%;text-align:left;background:none;border:1px solid var(--border-strong);
    border-radius:7px;color:var(--text-light);font:inherit;font-size:13px;padding:7px 10px;margin:0 0 6px;cursor:pointer}
  .fb-add-mode:hover{border-color:var(--primary);color:var(--text)}
  .fb-add-form{display:block;margin:4px 0 0;padding:9px;background:var(--bg);
    border:1px solid var(--line);border-radius:7px}
  .fb-add-frow{display:block;margin:0 0 8px}
  .fb-add-frow[hidden]{display:none}
  .fb-add-flabel{display:block;font-size:11px;font-weight:700;color:var(--text-muted);
    margin:0 0 3px;text-transform:uppercase;letter-spacing:.03em}
  .fb-add-input{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);
    border-radius:6px;font:inherit;font-size:13px;padding:6px 8px}
  textarea.fb-add-input{resize:vertical;min-height:40px}
  .fb-add-radio{display:inline-flex;align-items:center;gap:3px;margin-right:14px;font-size:13px;color:var(--text-light);cursor:pointer}
  .fb-add-hint{margin:0 0 7px;font-size:12px;color:var(--danger);font-weight:600}
  .fb-add-hint[hidden]{display:none}
  .fb-add-actions{display:flex;gap:6px;margin-top:4px}
  .fb-add-submit{background:var(--primary);color:#fff;border:1px solid var(--primary);border-radius:6px;
    font:inherit;font-size:12px;font-weight:600;padding:5px 14px;cursor:pointer}
  .fb-add-submit:hover{background:var(--primary-dark)}
  .fb-add-submit:disabled{opacity:.55;cursor:default}
  .fb-add-cancel{background:none;color:var(--text-light);border:1px solid var(--border-strong);
    border-radius:6px;font:inherit;font-size:12px;padding:5px 12px;cursor:pointer}
  .fb-add-cancel:hover{color:var(--text);border-color:var(--text-light)}

  /* ---- advisor inline-edit field editors — used by the "Edit text" dialog opened
     from the action-sheet kebab (declutter). The per-field editor (lightTidy + the
     edit_text op) is reused; the old always-on .fb-ictrl / .fb-ic-* cluster was
     replaced by the kebab ☰ + drag handle ⠿ + action sheet. ---- */
  .fb-ie-panel{display:block;margin:8px 0 4px;padding:10px;background:var(--panel-2);
    border:1px solid var(--border-strong);border-radius:8px;width:100%}
  .fb-ie-row{display:block;margin:0 0 10px}
  .fb-ie-row:last-child{margin-bottom:0}
  .fb-ie-label{display:block;font-size:11px;font-weight:700;color:var(--text-muted);margin:0 0 3px;text-transform:uppercase;letter-spacing:.03em}
  .fb-ie-input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);
    border-radius:6px;font:inherit;font-size:13px;padding:6px 8px}
  textarea.fb-ie-input{resize:vertical;min-height:48px}
  .fb-ie-status{margin:5px 0 0;font-size:12px;color:var(--text-light)}
  .fb-ie-status[hidden]{display:none}
  .fb-ie-tidied{color:var(--accent);font-weight:600}
  .fb-ie-undo{background:none;border:0;color:var(--primary);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer;padding:0}
  .fb-ie-actions{display:flex;gap:6px;margin-top:7px}
  .fb-ie-save{background:var(--primary);color:#fff;border:1px solid var(--primary);border-radius:6px;
    font:inherit;font-size:12px;font-weight:600;padding:5px 12px;cursor:pointer}
  .fb-ie-save:hover{background:var(--primary-dark)}
  .fb-ie-save:disabled{opacity:.55;cursor:default}
  .fb-ie-cancel{background:none;color:var(--text-light);border:1px solid var(--border-strong);
    border-radius:6px;font:inherit;font-size:12px;padding:5px 12px;cursor:pointer}
  .fb-ie-cancel:hover{color:var(--text);border-color:var(--text-light)}

  /* hidden-from-client visual state: dim the item + a clear badge (advisor view only) */
  .fb-hidden{opacity:.6}
  .fb-card.fb-hidden{border-style:dashed}
  .fb-day.fb-hidden{border-style:dashed}
  .tag.fb-hidden-badge{background:var(--panel-2);color:var(--warning);border:1px solid var(--warning)}
  .fb-day-ctrl-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 8px}
  .group-note.fb-empty-prose{color:var(--text-muted);font-style:italic}

  /* ---- Submit-to-AI button + summary dialog (advisor view only, B-queue commit) ---- */
  /* The Submit-to-AI button lives INSIDE the sticky-total bar (reuses .fb-send.lit) —
     one compact footer, no separate floating bar. The count badge rides the white
     button, so it's a filled primary pill (white-on-white would vanish). */
  .fb-submitai-badge{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;
    margin-left:8px;padding:0 6px;border-radius:100px;background:var(--primary);color:#fff;font-size:12px;font-weight:800}
  .fb-submitai-badge[hidden]{display:none}
  .fb-dialog{border:1px solid var(--border-strong);border-radius:var(--radius);padding:0;max-width:420px;width:92%;
    background:var(--panel);color:var(--text)}
  .fb-dialog::backdrop{background:rgba(0,0,0,.55)}
  .fb-dialog .fb-dialog-in{padding:20px}
  .fb-dialog .fb-dsub{margin:0 0 16px;font-size:14px;line-height:1.5;color:var(--text-light)}
  .fb-dialog .fb-dialog-actions{display:flex;justify-content:flex-end}

  /* ---- advisor action sheet (declutter: kebab ☰ + drag handle ⠿) — advisor view only ---- */
  .fb-item-row{display:flex;align-items:flex-start;gap:8px;padding:8px 4px;border-radius:10px;
    transition:background .12s,box-shadow .12s,opacity .12s}
  .fb-item-row .fb-item-main{flex:1;min-width:0}
  .fb-handle{flex:0 0 auto;width:30px;min-height:34px;display:inline-flex;align-items:center;justify-content:center;
    color:var(--text-muted);font-size:18px;cursor:grab;touch-action:none;border-radius:8px;user-select:none;-webkit-user-select:none}
  .fb-handle:active{cursor:grabbing;background:var(--panel-2)}
  .fb-handle:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
  .fb-kebab{flex:0 0 auto;width:36px;height:36px;border:1px solid var(--border-strong);border-radius:9px;
    background:var(--panel);color:var(--text-light);font-size:15px;line-height:1;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center}
  .fb-kebab:hover{border-color:var(--primary);color:var(--text)}
  /* option cards keep their card chrome; the kebab floats top-right, the handle sits left */
  .fb-card .fb-kebab{position:absolute;top:8px;right:8px}
  .fb-card .fb-handle{position:absolute;top:6px;left:6px}
  .fb-card.fb-has-adv-ctrl{position:relative;padding-left:34px}
  .fb-item-row.fb-dragging,.fb-card.fb-dragging{background:#173456;color:#e7eef6;box-shadow:0 12px 28px rgba(0,0,0,.45);opacity:.98;outline:1px solid #3a7bd0}
  @keyframes fbLandGlow{0%,68%{background:#173456}100%{background:transparent}}
  .fb-item-row.fb-landed,.fb-card.fb-landed{animation:fbLandGlow 3s ease forwards}

  .fb-scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .18s}
  .fb-scrim--on{opacity:1;pointer-events:auto}
  .fb-sheet{position:fixed;left:8px;right:8px;bottom:8px;z-index:31;max-width:560px;margin:0 auto;
    background:var(--panel);border:1px solid var(--border-strong);border-radius:20px;padding:8px;
    transform:translateY(125%);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
  .fb-sheet--on{transform:translateY(0)}
  .fb-grab{width:38px;height:5px;border-radius:3px;background:var(--border-strong);margin:7px auto 4px}
  .fb-sheet-h{color:var(--text-muted);font-size:13px;text-align:center;padding:4px 8px 9px;
    border-bottom:1px solid var(--line);margin-bottom:4px}
  .fb-sheet-h b{color:var(--text)}
  .fb-ai-box{display:flex;gap:8px;padding:10px 6px 12px;align-items:center}
  .fb-ai-input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--border-strong);border-radius:10px;
    color:var(--text);font:inherit;font-size:15px;padding:11px 12px;outline:none}
  .fb-ai-input:focus{border-color:var(--primary)}
  .fb-ai-input::placeholder{color:var(--text-muted)}
  .fb-ai-send{flex:0 0 auto;background:var(--primary);color:#fff;border:1px solid var(--primary);border-radius:10px;
    font:inherit;font-weight:700;font-size:14px;padding:11px 15px;cursor:pointer}
  .fb-ai-send:hover{background:var(--primary-dark)}
  .fb-srow{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:none;border:0;
    padding:14px 12px;border-radius:11px;color:var(--text);font:inherit;font-size:16px;cursor:pointer}
  .fb-srow:hover{background:var(--panel-2)}
  .fb-srow-ico{width:22px;text-align:center;font-size:16px;flex:0 0 auto}
  .fb-srow--danger{color:var(--danger)}
  .fb-sep{height:1px;background:var(--line);margin:2px 10px}
  .fb-cancel{display:block;width:100%;margin-top:8px;text-align:center;background:var(--panel-2);
    color:var(--primary);border:0;border-radius:11px;font:inherit;font-size:16px;font-weight:600;padding:14px;cursor:pointer}
  .fb-pane-days{display:none}
  .fb-sheet--days .fb-pane-main{display:none}
  .fb-sheet--days .fb-pane-days{display:block}
  .fb-days-h{display:flex;align-items:center;gap:8px;padding:6px 4px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
  .fb-days-back{background:none;border:0;color:var(--primary);font:inherit;font-size:15px;font-weight:600;padding:6px 8px;cursor:pointer}
  .fb-days-title{color:var(--text-muted);font-size:13px}
  .fb-daylist{max-height:54vh;overflow:auto;-webkit-overflow-scrolling:touch}
  .fb-dayrow{display:flex;align-items:baseline;gap:12px;width:100%;text-align:left;background:none;border:0;
    padding:14px 12px;border-radius:10px;color:var(--text);font:inherit;cursor:pointer}
  .fb-dayrow:hover{background:var(--panel-2)}
  .fb-dnum{color:var(--text-muted);font-size:13px;flex:0 0 auto;width:120px}
  .fb-dttl{font-size:15px}
  .fb-toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(10px);z-index:40;
    background:var(--panel-2);color:var(--text);border:1px solid var(--border-strong);border-radius:11px;
    padding:10px 16px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:84%;text-align:center}
  .fb-toast--on{opacity:1;transform:translateX(-50%) translateY(0)}
  .fb-edit-dialog{max-width:480px}

  /* ---- badges pane (mirrors pane-days pattern) ---- */
  .fb-pane-badges{display:none}
  .fb-sheet--badges .fb-pane-main{display:none}
  .fb-sheet--badges .fb-pane-badges{display:block}
  .fb-badges-h{display:flex;align-items:center;gap:8px;padding:6px 4px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
  .fb-badges-back{background:none;border:0;color:var(--primary);font:inherit;font-size:15px;font-weight:600;padding:6px 8px;cursor:pointer}
  .fb-badges-title{color:var(--text-muted);font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fb-badgebody{max-height:60vh;overflow:auto;-webkit-overflow-scrolling:touch}
  .fb-badge-group{margin-bottom:4px}
  .fb-badge-group-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
