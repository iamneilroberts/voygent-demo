name = "voygent-demo"
main = "worker/index.ts"
compatibility_date = "2024-05-12"
compatibility_flags = ["nodejs_compat"]

# demo.voygent.ai (the [[routes]] below) is the SOLE canonical origin. The workers.dev
# subdomain is intentionally retired: APP_ORIGIN is single-valued, so POSTs from
# voygent-demo.somotravel.workers.dev would 403 anyway — a GET-only host that can't auth
# is just confusing. To temporarily restore it, flip this to true and redeploy.
# (Must stay a TOP-LEVEL key — above the first [table] header — or TOML binds it to a table.)
workers_dev = false

# Serve the built React SPA from the same Worker as the /chat API (single origin,
# no CORS, one deploy). The Worker handles POST /chat; everything else falls back
# to the SPA's index.html. Build the SPA first: VITE_API_BASE= npm run build:web
[assets]
directory = "./dist-web"
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "SESSION"
class_name = "SessionDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionDO"]

# Engineering-stats history (one row per completed exchange). Both the SessionDO
# (writes) and the top-level worker (GET /stats reads) bind STATS_DB.
# DEPLOY STEP 1 (before `wrangler deploy`): create the DB and paste its id here:
#   wrangler d1 create voygent-demo-stats   →   copy database_id below
#   wrangler d1 execute voygent-demo-stats --remote --file migrations/0001_session_stats.sql
# Until then the binding is absent in dev/test and the feature is a silent no-op.
[[d1_databases]]
binding = "STATS_DB"
database_name = "voygent-demo-stats"
database_id = "20321ac2-3669-489e-b67c-5e5bd91d6f2e"

# demo.voygent.ai is served by a MORE-SPECIFIC route than the *.voygent.ai wildcard
# (which points every other subdomain at the prod `voygent` Worker). Most-specific-wins —
# the same mechanism staging.voygent.ai / staging-test.voygent.ai already use safely in this
# zone. We use a plain route PATTERN, not custom_domain=true: the 2026-06-05 regression that
# knocked out the workers.dev route was a custom_domain attachment, which this avoids.
# (workers_dev is retired — set at the top of this file.)
# Runbook: ~/dev/voygent-lite/docs/runbooks/2026-06-09-demo-voygent-ai-domain-and-admin-access.md
[[routes]]
pattern = "demo.voygent.ai/*"
zone_name = "voygent.ai"

# Secrets (set via `wrangler secret put`, NOT checked in):
#   ANTHROPIC_API_KEY, VOYGENT_MCP_URL, VOYGENT_MCP_BEARER, and optional DEMO_DISABLED.
#   DEEPSEEK_API_KEY (+ DEMO_DEEPSEEK_ENABLED=1 to go live), optional DEEPSEEK_BASE_URL.
#   OLLAMA_BASE_URL / DEMO_OLLAMA_URL are local-dev only (a deployed Worker can't reach localhost).
#   CODE_HASH_KEY (HMAC key for hashing passcodes), SESSION_SIGN_KEY (HMAC key for signing
#   session cookies), optional ADMIN_TOKEN (bearer for /admin/* endpoints), and optional
#   EST_EXCHANGE_MICROS (override default per-exchange micro-USD estimate).
#   RESEND_API_KEY (Resend send key — reuse the existing Voygent value; sends from the
#     already-verified voygent.ai domain). Unset ⇒ all onboarding/grant emails no-op silently.
#   VOYGENT_MCP_BEARER_PRO (Neil's real-credentialed Voygent identity, used only for tier='pro'
#     live sessions). Unset ⇒ pro codes refuse live with "pro access not enabled" (fail closed).
# Kept as secrets (not [vars]) so the MCP target can be flipped staging<->prod
# with a single `wrangler secret put` and no redeploy.
#
# ⚠️  CREDENTIAL-ISOLATION PREREQUISITE: VOYGENT_MCP_BEARER (the PUBLIC-tier bearer) MUST be a
#     credential-free Voygent identity — a free-tier user with NO supplier creds — before any
#     public live session runs. Public self-serve codes select this bearer; the only thing
#     stopping a public visitor from reaching real supplier creds is that this identity has none.
#     Verify, do not assume. Until confirmed, keep DEMO_PUBLIC_LIVE_ENABLED unset.

[[d1_databases]]
binding = "DEMO_DB"
database_name = "voygent-demo"
database_id = "7825123d-3e56-423b-b2da-c5add703b252"

[vars]
# The exact origin the SPA is served from. Used by the Origin/CSRF guard — POSTs whose
# Origin != APP_ORIGIN are 403'd, so this MUST equal the canonical live host.
# Local dev (wrangler dev): http://localhost:8787. Prod: demo.voygent.ai (the route above).
# NOTE: this is single-valued — hand out demo.voygent.ai/#code=... invite links.
# (workers.dev is retired — see the workers_dev note at the top of this file.)
APP_ORIGIN = "https://demo.voygent.ai"
# NEIL_NOTIFY_EMAIL — recipient for pro-access request notifications (POST /pro-request).
#   Unset ⇒ requests are still captured in D1; only the heads-up email is skipped.
# NEIL_NOTIFY_EMAIL = "dneilroberts@gmail.com"
# ONBOARD_IP_DAILY_CAP — max self-serve public codes one IP can mint per UTC day (default 3).
# ONBOARD_IP_DAILY_CAP = "3"
# DEMO_PUBLIC_LIVE_ENABLED — gate for the public live path (ENFORCED in
#   session-do.ts via resolveLiveBearer). UNSET ⇒ public-tier LIVE sessions are refused
#   with a 503 (the reel still plays — it makes no MCP calls). Keep it unset until
#   VOYGENT_MCP_BEARER is confirmed credential-free (see the ⚠️ prerequisite above); then
#   set it to open public live. Defense-in-depth — the credential-free bearer is still the
#   primary isolation guarantee.
# DEMO_PUBLIC_LIVE_ENABLED = "1"
